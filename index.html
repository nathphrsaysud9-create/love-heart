<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I love you — in every language</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const P=["I love you", "Je t'aime", "Te amo", "Ich liebe dich", "Ti amo", "Eu te amo", "Ik hou van jou", "Jag älskar dig", "Я тебя люблю", "Σ' αγαπώ", "Aku cinta kamu", "Anh yêu em", "ฉันรักเธอ", "我爱你", "愛してる", "사랑해", "Seni seviyorum", "Kocham cię", "मैं तुमसे प्यार करता हूँ"];
const cv=document.getElementById("c"),g=cv.getContext("2d");
let items=[],t0=0,sprites=new Map(),dpr=1,lastFrame=0;const DUR=15000,FPS_INTERVAL=1000/30;
function shuf(a){a=a.slice(1);for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return[P[0],...a]}
let FS=10;
function build(){
  const d=dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;
  sprites=new Map();lastFrame=0;
  cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);
  const s=Math.min(W*0.92/32,H*0.82/29),cx=W/2,cy=H/2-2.5*s,fs=FS=Math.max(6,s*0.55);
  g.font=fs+"px system-ui,'Noto Sans',sans-serif";
  const N=720,poly=[];
  for(let i=0;i<N;i++){const t=i/N*6.2832;poly.push([cx+16*Math.pow(Math.sin(t),3)*s,cy-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s]);}
  // Round the bottom cusp with a short quadratic Bezier fillet.
  const tip=poly.reduce((best,p,i)=>p[1]>poly[best][1]?i:best,0),cut=46,rounded=[];
  const start=(tip-cut+N)%N,end=(tip+cut)%N,a=poly[start],c=poly[tip],b=poly[end];
  for(let i=0;i<N;i++){
    if(i===start){rounded.push(a);for(let k=1;k<=24;k++){const u=k/24,v=1-u;rounded.push([v*v*a[0]+2*v*u*c[0]+u*u*b[0],v*v*a[1]+2*v*u*c[1]+u*u*b[1]]);}i=end;}
    else rounded.push(poly[i]);
  }
  poly.length=0;poly.push(...rounded);
  const roundY=cy+12.8*s,roundR=2.0*s,roundBottom=roundY+1.55*s;
  const inside=(x,y)=>{if(y>=roundY)return y<=roundBottom&&(x-cx)*(x-cx)+(y-roundY)*(y-roundY)<=roundR*roundR;let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c};
  let q=shuf(P),qi=0;const next=()=>{if(qi>=q.length){q=shuf(P);qi=0}return q[qi++]};
  const pitch=fs*1.35;items=[];
  for(let y=cy-12*s+pitch*0.6;y<cy+17*s;y+=pitch){
    const segs=[];let st=null;
    for(let x=0;x<=W;x++){const n=inside(x,y);if(n&&st===null)st=x;if(!n&&st!==null){segs.push([st,x]);st=null}}
    for(const [a0,b0] of segs){
      const a=a0+fs*0.4,L=b0-a0-fs*0.8;if(L<fs*3)continue;
      const row=[];let tot=0;
      for(let k=0;k<14;k++){const w=next(),ww=g.measureText(w).width;
        if(tot+ww+row.length*fs*0.6<=L){row.push([w,ww]);tot+=ww}else if(row.length&&tot>L*0.8)break}
      if(!row.length)continue;
      const gap=row.length>1?Math.min((L-tot)/(row.length-1),fs*1.5):0;
      let x=a+(L-tot-gap*(row.length-1))/2;
      for(const [w,ww] of row){items.push({t:w,x:x+ww/2,y,a:0.92+Math.random()*0.08,phase:Math.random()*Math.PI*2,ampX:0.8+Math.random()*1.2,ampY:0.7+Math.random()*1.0,speed:0.001+Math.random()*0.0005});x+=ww+gap}
    }
  }
  // Cheap center-to-edge ordering avoids scanning every boundary vertex for every phrase.
  items.forEach(it=>it.k=Math.hypot((it.x-cx)/(16*s),(it.y-cy)/(19*s)));
  items.sort((u,v)=>u.k-v.k);
  items.forEach((it,i)=>it.d=i/items.length*(DUR-700));
  // Rasterize each unique phrase once; animation frames only draw cached sprites.
  for(const text of new Set(items.map(it=>it.t))) spriteFor(text);
  t0=performance.now();
}
function spriteFor(text){
  if(sprites.has(text))return sprites.get(text);
  const blur=Math.max(14,FS*1.8),glowBlur=blur*2.2,pad=Math.ceil(glowBlur*2.4+4);
  g.font=FS+"px system-ui,'Noto Sans',sans-serif";
  const w=Math.ceil(g.measureText(text).width+pad*2),h=Math.ceil(FS*2.2+pad*2);
  const canvas=document.createElement("canvas");canvas.width=Math.ceil(w*dpr);canvas.height=Math.ceil(h*dpr);
  const c=canvas.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
  c.font=FS+"px system-ui,'Noto Sans',sans-serif";c.textAlign="center";c.textBaseline="middle";
  // Glow and crisp core use the original coral-red code color.
  c.globalCompositeOperation="lighter";c.shadowColor="rgba(255,84,76,0.98)";c.shadowBlur=glowBlur;
  c.fillStyle="rgba(255,84,76,0.92)";c.fillText(text,w/2,h/2);
  c.shadowBlur=blur*1.1;c.fillStyle="rgba(255,84,76,0.82)";c.fillText(text,w/2,h/2);
  c.globalCompositeOperation="source-over";c.shadowBlur=0;c.fillStyle="#ff544c";c.fillText(text,w/2,h/2);
  const sprite={canvas,w,h};sprites.set(text,sprite);return sprite;
}
function frame(now){
  if(now-lastFrame<FPS_INTERVAL){requestAnimationFrame(frame);return;}
  lastFrame=now;
  const e=now-t0;
  g.fillStyle="#000";g.fillRect(0,0,innerWidth,innerHeight);
  for(const it of items){
    const f=Math.min(1,(e-it.d)/600);if(f<=0)continue;
    const dx=Math.sin(e*it.speed+it.phase)*it.ampX;
    const dy=Math.cos(e*it.speed*0.83+it.phase*1.37)*it.ampY;
    const px=it.x+dx,py=it.y+dy,sprite=sprites.get(it.t);
    // Each phrase gently pulses between nearby brightness levels of the same coral-red.
    const shade=0.84+0.16*(0.5+0.5*Math.sin(e*0.0014+it.phase));
    g.globalAlpha=f*it.a*shade;
    g.drawImage(sprite.canvas,px-sprite.w/2,py-sprite.h/2,sprite.w,sprite.h);
  }
  g.globalAlpha=1;
  requestAnimationFrame(frame);
}
addEventListener("resize",build);
cv.addEventListener("pointerdown",build);
build();requestAnimationFrame(frame);
</script>
</body>
</html>
